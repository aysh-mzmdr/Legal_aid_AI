[project]
name = "rag-model"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "aysh-mzmdr", email = "ayush.mazumdar111@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "pymupdf>=1.28.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "torch>=2.11.0",
]

[project.scripts]
rag-model = "rag_model:main"
rag-ingest = "rag_model.ingest.build:main"
rag-index = "rag_model.index.build:main"
rag-search = "rag_model.index.search:main"

# CUDA build of PyTorch (the default PyPI wheel on Windows is CPU-only).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
